spring:
  # 아무도 듣지 않는 주소. 개발 PC에 떠 있는 ES에 테스트 데이터가 들어가지 않게 한다(ES 테스트는 컨테이너 주소로 덮어쓴다)
  elasticsearch:
    uris: http://localhost:1
  datasource:
    url: jdbc:tc:mysql:8.4:///cartmatedb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      minimum-idle: 1
      idle-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

logging:
  level:
    com.cartmate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.testcontainers: INFO

product:
  global:
    internalUrl: http://test-url.com
  # 내부 전용 포트는 임의 포트로 연다. 고정 포트(9982)면 테스트 컨텍스트가 여러 개 뜰 때 포트가 겹친다
  internal-server:
    port: 0

cartmate:
  search:
    init:
      enabled: false   # 테스트마다 앱이 뜰 때 ES 색인을 만들지 않는다. 필요한 테스트만 켠다
