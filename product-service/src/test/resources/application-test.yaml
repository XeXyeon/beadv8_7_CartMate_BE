spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///cartmatedb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      minimum-idle: 1
      idle-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

logging:
  level:
    com.cartmate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.testcontainers: INFO

product:
  global:
    internalUrl: http://test-url.com
  # 내부 전용 포트는 임의 포트로 연다. 고정 포트(9982)면 테스트 컨텍스트가 여러 개 뜰 때 포트가 겹친다
  internal-server:
    port: 0