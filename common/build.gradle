// 모든 서비스가 함께 쓰는 공통 코드(global). 실행 jar가 아닌 라이브러리로 빌드한다
plugins {
    id 'java-library'
}

dependencies {
    // api: 이 모듈을 쓰는 서비스에도 그대로 전달된다 (global 클래스의 public 시그니처에 나오는 라이브러리)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-aspectj'

    // Redisson: 분산 락(global/lock) · RedissonConfig. 컴파일만 하고 넘기지 않는다.
    // 락을 쓰는 서비스(payment · etc)만 직접 넣고, 없는 서비스에서는 빈이 만들어지지 않는다(@ConditionalOnClass)
    compileOnly 'org.redisson:redisson:4.8.0'

    // QueryDSL: BaseEntity 같은 공통 엔티티의 Q클래스도 여기서 만든다
    api 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // S3: S3Config. 컴파일만 하고 넘기지 않는다. 이미지를 올리는 서비스(product)만 직접 넣는다(@ConditionalOnClass)
    compileOnly platform('software.amazon.awssdk:bom:2.25.0')
    compileOnly 'software.amazon.awssdk:s3'

    // Outbox · ShedLock
    api 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    api 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Kafka: 공용 전송 싱크 · 수신 다리(global/kafka). 쓰는 서비스만 spring-boot-starter-kafka를 직접 넣는다.
    // 여기서는 컴파일만 하고 넘기지 않아 Kafka를 안 쓰는 서비스에는 들어가지 않는다
    compileOnly 'org.springframework.kafka:spring-kafka'

    // 내부 API 클라이언트(global/http)가 RestClient.Builder 빈을 받는다 (관찰 붙음 → 호출마다 traceparent 헤더)
    api 'org.springframework.boot:spring-boot-starter-restclient'

    // 관측 가능성: 여기는 API만. 실제 추적기 · OTLP 내보내기 · actuator · Sentry 스타터는 각 서비스 build.gradle이 넣는다
    api 'io.micrometer:micrometer-tracing'                 // traceparent 도우미(global/observability)가 Tracer를 씀. 추적기가 없으면 NOOP
    compileOnly "io.sentry:sentry:${sentryVersion}"       // SentryEventFilter. Sentry가 있는 서비스에서만 빈이 생긴다
    compileOnly 'io.micrometer:context-propagation'        // 비동기 실행기에 traceId 넘기기(AsyncConfig). 있는 서비스에서만 켜진다

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.redisson:redisson:4.8.0'                     // 의존성이 있을 때 · 없을 때 빈이 켜지고 꺼지는지 테스트
    testImplementation platform('software.amazon.awssdk:bom:2.25.0')
    testImplementation 'software.amazon.awssdk:s3'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'   // traceparent 왕복 테스트용 실제 추적기 (버전은 BOM)
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testImplementation "io.sentry:sentry:${sentryVersion}"
    testImplementation 'io.micrometer:context-propagation'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
