spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

logging:
  level:
    com.cartmate: INFO
  structured:
    format:
      console: logstash   # 운영 로그는 JSON 한 줄 (traceId · event 등이 필드로 → Alloy가 Loki로)

sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}

# 운영에서는 API 문서(/v3/api-docs)와 Swagger UI를 끈다 → springdoc 빈과 클래스를 만들지 않는다. dev 프로필에서는 그대로 쓴다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

custom:
  jwt:
    secret: ${JWT_SECRET}
  wallet:
    withdraw:
      transfer-mode: ${WALLET_TRANSFER_MODE:manual} # 이체 계약 전에는 관리자가 직접 송금
      account-encryption-key: ${WALLET_ACCOUNT_ENCRYPTION_KEY} # 기본값 없음: 빠뜨리면 앱이 시작되지 않는다

product:
  global:
    internalUrl: ${PRODUCT_URL}

storage:
  s3:
    bucket: team07-cartmate-s3-storage
    region: ap-northeast-2
    public-url: https://team07-cartmate-s3-storage.s3.ap-northeast-2.amazonaws.com

cartmate:
  internal:
    api-key: ${INTERNAL_API_KEY}   # 기본값 없음 → 빠뜨리면 앱이 뜨지 않음