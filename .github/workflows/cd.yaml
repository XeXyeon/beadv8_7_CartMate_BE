name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 특정 서비스를 원하는 태그로 배포하거나 되돌릴 때 쓴다
  workflow_dispatch:
    inputs:
      service:
        description: '배포할 서비스'
        required: true
        type: choice
        options: [ member-service, product-service, order-service, payment-service, etc-service ]
      tag:
        description: '배포할 이미지 태그 (예: sha-b66aefb)'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # CI 실행이 남긴 배포 대상 목록(artifact)을 읽는다

env:
  SERVICES: member-service product-service order-service payment-service etc-service
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61   # kustomize_v5.8.3_linux_amd64.tar.gz

# 액션은 태그가 아니라 커밋 해시로 고정한다. 주석은 해시의 버전
jobs:
  deploy:
    # CI가 성공했고, main에 push됐거나 main에서 수동 실행된 경우만 자동 배포한다
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # 자동 배포: CI가 남긴 목록(이번에 이미지를 새로 만든 서비스). 이미지를 만든 서비스가 없으면 목록이 없다
      - name: Download deploy targets
        if: github.event_name == 'workflow_run'
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-targets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # targets: 새 이미지로 바꿀 서비스(공백 구분), tag: 새 이미지 태그
      - name: Decide targets and tag
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            targets="$INPUT_SERVICE"; tag="$INPUT_TAG"
          else
            targets=$(cat deploy-targets.txt 2>/dev/null | tr '\n' ' ' | xargs || true)
            tag="sha-${HEAD_SHA::7}"
          fi
          if [ -z "$targets" ]; then
            echo "새로 만든 이미지가 없어서 배포하지 않는다"
          else
            echo "배포할 서비스: $targets / 태그: $tag"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install kustomize
        if: steps.plan.outputs.targets != ''
        run: |
          file="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$file" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/$file"
          echo "$KUSTOMIZE_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" kustomize
          sudo install -m 755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Prepare SSH key
        if: steps.plan.outputs.targets != ''
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

      # 바뀌지 않은 서비스는 지금 클러스터에서 돌고 있는 이미지를 그대로 쓴다(매니페스트가 같으면 Pod가 재시작되지 않는다)
      # 서버의 kubectl(k3s 내장)은 KUBECONFIG가 없으면 관리자 설정(/etc/rancher/k3s/k3s.yaml, root만 읽음)을 읽는다
      # 그래서 deploy 계정의 최소 권한 설정(~/.kube/config, k8s/rbac/cd-deployer.yaml)을 직접 지정한다
      - name: Read running images
        if: steps.plan.outputs.targets != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" \
            "KUBECONFIG=\$HOME/.kube/config kubectl -n cartmate get deployments -o jsonpath='{range .items[*]}{.metadata.name}={.spec.template.spec.containers[0].image}{\"\n\"}{end}'" \
            > running-images.txt
          echo "지금 돌고 있는 이미지:"
          cat running-images.txt

      # 매니페스트의 이미지 자리(cartmate-<서비스>)를 실제 이미지 · 태그로 바꿔 파일 하나로 만든다
      #   이번 대상 → 새 태그 / 그 외 → 지금 돌고 있는 이미지 / 클러스터에 아직 없는 서비스 → 이번 배포에서 뺀다
      - name: Render manifests
        if: steps.plan.outputs.targets != ''
        env:
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          cd k8s
          for service in $SERVICES; do
            if [[ " $TARGETS " == *" $service "* ]]; then
              image="$REGISTRY/cartmate-$service:$TAG"
            else
              image=$(grep "^$service=" ../running-images.txt | cut -d= -f2- || true)
            fi
            if [ -z "$image" ]; then
              echo "::warning::$service는 클러스터에 없어서 이번 배포에서 뺀다. 처음 배포하려면 CD를 수동 실행해서 태그를 지정한다"
              kustomize edit remove resource "$service.yaml"
              continue
            fi
            kustomize edit set image "cartmate-$service=$image"
          done
          kustomize build . > ../cartmate.yaml
          grep 'image:' ../cartmate.yaml

      - name: Copy manifests to server
        if: steps.plan.outputs.targets != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/cartmate"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            cartmate.yaml "$SERVER_USER@$SERVER_HOST:~/cartmate/cartmate.yaml"

      # 적용 후 이번에 바꾼 서비스만 새 Pod가 준비(readiness)될 때까지 기다린다. 하나라도 실패하면 이 단계가 실패한다
      # 바뀌지 않은 서비스는 기다리지 않는다(이전부터 비정상인 서비스 때문에 이번 배포가 실패로 표시되지 않게)
      - name: Deploy
        if: steps.plan.outputs.targets != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGETS: ${{ steps.plan.outputs.targets }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" "
              set -e
              export KUBECONFIG=\$HOME/.kube/config
              kubectl apply -f ~/cartmate/cartmate.yaml
              for service in $TARGETS; do
                kubectl -n cartmate rollout status deployment/\$service --timeout=5m
              done
            "
