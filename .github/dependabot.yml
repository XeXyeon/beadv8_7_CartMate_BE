# 고정해 둔 액션 커밋 해시의 새 버전이 나오면 올리는 PR을 자동으로 만든다. 머지는 사람이 판단한다
# 나온 지 14일이 안 된 버전은 제안하지 않는다(문제 있는 릴리스가 바로 들어오지 않게)
#
# Dockerfile 베이스 이미지(eclipse-temurin)는 Dependabot에서 뺐다. 태그 형식(25.0.5_8-jdk-alpine-3.24)을 제대로 비교하지 못해
# 25-jdk-alpine-3.21처럼 버전이 고정되지 않고 Alpine도 더 낮은 태그를 제안했다. 베이스 이미지는 Java 패치가 나올 때 손으로 올린다
#   (Dockerfile의 태그와 digest를 같이 바꾼다. 확인: Docker Hub eclipse-temurin 태그 목록)
version: 2
updates:
  # .github/workflows/*.yaml의 uses: 줄(해시와 뒤의 버전 주석을 같이 바꾼다)
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: [ '*' ]
    commit-message:
      prefix: ci
