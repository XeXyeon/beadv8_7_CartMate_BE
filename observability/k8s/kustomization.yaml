# CartMate 운영 관측 (k3s): Alloy 1개(수집 → Grafana Cloud) + kube-state-metrics
#   적용: kubectl apply -k observability/k8s   (먼저 README의 Secret 2개를 만든다)
#   Kafka UI · kafka-exporter(메모리 약 416Mi)는 서버 메모리가 빠듯해 지금은 빼 둔다. 쓰려면 아래 주석을 풀고 README 7절 참고
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - alloy.yaml
  - kube-state-metrics.yaml
  # - kafka-exporter.yaml
  # - kafka-ui.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy=alloy/config.alloy

generatorOptions:
  disableNameSuffixHash: false   # 설정이 바뀌면 이름이 바뀌어 Alloy가 자동으로 다시 뜬다
