# CartMate 백엔드 서비스 5개 (k3s, cartmate 네임스페이스)
#
# 배포는 CD(.github/workflows/cd.yaml)가 이미지 이름 · 태그를 바꿔서 적용한다
#   CD는 cartmate 네임스페이스의 최소 권한 계정(rbac/cd-deployer.yaml)으로 적용한다
#   그래서 네임스페이스(namespace.yaml)와 RBAC는 이 목록에 넣지 않고, 서버에서 관리자 권한으로 한 번 적용한다
#     sudo kubectl apply -f k8s/namespace.yaml
#     sudo kubectl apply -f k8s/rbac/cd-deployer.yaml
#
# Secret은 저장소에 두지 않는다. 처음 한 번 서버에서 만든다 (값은 파일 · 채팅에 남기지 않는다)
#   공통 (서비스 5개 모두):
#     kubectl -n cartmate create secret generic cartmate-app-secret \
#       --from-literal=JWT_SECRET=... --from-literal=INTERNAL_API_KEY=... \
#       --from-literal=REDIS_PASSWORD=... --from-literal=SENTRY_DSN=... --from-literal=TOSS_SECRET_KEY=...
#   서비스별 DB (member · product · payment · etc 키 이름: DB_URL · DB_USERNAME · DB_PASSWORD):
#     kubectl -n cartmate create secret generic product-service-secret \
#       --from-literal=DB_URL='jdbc:mysql://mysql-product:3306/cartmate_product?serverTimezone=Asia/Seoul' \
#       --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=...
#   order만 키 이름이 다르다: ORDER_DB_URL · ORDER_DB_USERNAME · ORDER_DB_PASSWORD
#   order는 DB 키에 더해: OPENAI_API_KEY (장바구니 상품 매칭의 임베딩 · 라벨 생성)
#     지금 코드는 아직 GEMINI_API_KEY를 읽는다. 매칭 코드가 OpenAI로 바뀌기 전까지는 키가 있어도 매칭이 꺼진 채(경고 로그만) 뜬다
#   member는 DB 키에 더해: MFA_CODE_SECRET · MFA_OTP_ENCRYPTION_KEY · 메일(SMTP) MAIL_HOST · MAIL_PORT · MAIL_USERNAME · MAIL_PASSWORD · MAIL_SMTP_AUTH · MAIL_STARTTLS · MAIL_FROM
#   product는 S3 접근 키가 필요하면: AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY (EC2 IAM 역할을 쓰면 넣지 않는다)
#   MySQL root (infra): kubectl -n cartmate create secret generic cartmate-mysql-root --from-literal=MYSQL_ROOT_PASSWORD=...
#   Elasticsearch (infra): kubectl -n cartmate create secret generic es-secret --from-literal=elastic-password=...
#   Docker Hub 이미지 받기: kubectl -n cartmate create secret docker-registry dockerhub-pull \
#       --docker-server=https://index.docker.io/v1/ --docker-username=... --docker-password=<Docker Hub 토큰>
#
# MySQL · Redis · Kafka는 infra/ 에 따로 있다(CD가 적용하지 않음). 서비스보다 먼저 적용한다
# 서비스 5개 모두 운영 ddl-auto가 update라 빈 DB로 첫 배포하면 테이블을 직접 만든다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartmate

resources:
  - config.yaml
  - ingress.yaml
  - member-service.yaml
  - product-service.yaml
  - order-service.yaml
  - payment-service.yaml
  - etc-service.yaml
