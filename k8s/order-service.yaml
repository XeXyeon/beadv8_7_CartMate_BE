apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 서버 메모리가 빠듯해서 새 Pod를 먼저 띄우지 않는다(maxSurge 0). 기존 Pod를 내리고 새 Pod를 띄운다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service   # Loki service 라벨. -service로 끝나야 로그를 수집한다
    spec:
      # 종료 순서: preStop 5초(Service 대상에서 빠질 시간) → 처리 중인 요청 마무리(Spring Boot graceful shutdown 기본, 최대 30초). 합 35초 < 45초
      terminationGracePeriodSeconds: 45
      containers:
        - name: order-service
          image: cartmate-order-service   # 실제 이미지 이름 · 태그는 CD가 kustomize로 바꾼다
          ports:
            - name: http
              containerPort: 8986
          envFrom:
            - configMapRef:
                name: cartmate-app-config
            - secretRef:
                name: cartmate-app-secret
            - secretRef:
                name: order-service-secret
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
          # 기동이 끝날 때까지(최대 5초 × 36 = 3분) liveness · readiness 검사를 하지 않는다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8986
      targetPort: http
