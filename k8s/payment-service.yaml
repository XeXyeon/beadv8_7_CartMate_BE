apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 서버 메모리가 빠듯해서 새 Pod를 먼저 띄우지 않는다(maxSurge 0). 기존 Pod를 내리고 새 Pod를 띄운다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service   # Loki service 라벨. -service로 끝나야 로그를 수집한다
    spec:
      # 종료 순서: preStop 5초(Service 대상에서 빠질 시간) → 처리 중인 요청 마무리(Spring Boot graceful shutdown 기본, 최대 30초). 합 35초 < 45초
      terminationGracePeriodSeconds: 45
      # 띄울 노드(cartmate/node 라벨). server = k3s server 노드(member · order · payment · etc), agent = k3s agent 노드(트래픽이 가장 많은 상품 서버를 떼어 둔다)
      nodeSelector:
        cartmate/node: server
      # Docker Hub에서 이미지를 받을 로그인 정보. 서버에서 한 번 만든다(Secret 이름 dockerhub-pull)
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: payment-service
          image: cartmate-payment-service   # 실제 이미지 이름 · 태그는 CD가 kustomize로 바꾼다
          ports:
            - name: http
              containerPort: 8983
          envFrom:
            - configMapRef:
                name: cartmate-app-config
            - secretRef:
                name: cartmate-app-secret
            - secretRef:
                name: payment-service-secret
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
          # 기동이 끝날 때까지(최대 5초 × 36 = 3분) liveness · readiness 검사를 하지 않는다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8983
      targetPort: http
