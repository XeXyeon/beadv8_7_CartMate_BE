apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 서버 메모리가 빠듯해서 새 Pod를 먼저 띄우지 않는다(maxSurge 0). 기존 Pod를 내리고 새 Pod를 띄운다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service   # Loki service 라벨. -service로 끝나야 로그를 수집한다
    spec:
      # 종료 순서: preStop 5초(Service 대상에서 빠질 시간) → 처리 중인 요청 마무리(Spring Boot graceful shutdown 기본, 최대 30초). 합 35초 < 45초
      terminationGracePeriodSeconds: 45
      # 띄울 노드. 트래픽이 가장 많은 상품 서버는 다른 서비스와 CPU를 나눠 쓰지 않게 agent 노드에 따로 둔다(자기 DB와 같은 노드)
      nodeSelector:
        cartmate/node: agent
      # Docker Hub에서 이미지를 받을 로그인 정보. 서버에서 한 번 만든다(Secret 이름 dockerhub-pull)
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: product-service
          image: cartmate-product-service   # 실제 이미지 이름 · 태그는 CD가 kustomize로 바꾼다
          ports:
            - name: http
              containerPort: 8982
          envFrom:
            - configMapRef:
                name: cartmate-app-config
            - secretRef:
                name: cartmate-app-secret
            - secretRef:
                name: product-service-secret
          env:
            # 판매글이 상품 API를 부르는 주소. 같은 Pod의 내부 전용 포트(product.internal-server.port, 9982)로 바로 부른다
            # 바깥 요청 포트(8982)와 스레드 풀을 나눠 자기 호출 교착상태를 막는다. 9982는 Service · Ingress에 열지 않는다
            # env가 envFrom(cartmate-app-config의 PRODUCT_URL)보다 우선한다
            - name: PRODUCT_URL
              value: http://localhost:9982
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          # 기동이 끝날 때까지(최대 5초 × 36 = 3분) liveness · readiness 검사를 하지 않는다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 8982
      targetPort: http
