# Kafka 1대 (KRaft: ZooKeeper 없이 브로커와 컨트롤러를 한 프로세스가 맡는다)
# 기존 서버(개발용 infra 네임스페이스) 설정을 따르고, 두 가지만 바꿨다
#   1. 토픽 자동 생성을 켠다(앱에 토픽 생성 코드가 없다. 토픽 이름: cartmate.<모듈>.<이벤트 이름>, 실패 메시지: <토픽>-dlt)
#   2. 내부 주소의 네임스페이스를 infra → cartmate로 바꾼다
#
# 접속 주소
#   클러스터 안(앱): cartmate-kafka-bootstrap:9092 (k8s/config.yaml의 KAFKA_BOOTSTRAP_SERVERS)
#   로컬 개발: 노드의 30094(NodePort)를 localhost:30094로 연결해서 붙는다(예: ssh -L 30094:localhost:30094). 방화벽으로 접근을 제한한다
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  # KRaft 단일 노드 (broker + controller). CLUSTER_ID는 처음 기동할 때 저장소를 포맷하는 ID라 바꾸면 기존 데이터를 못 읽는다
  CLUSTER_ID: "KBDjAtTXR8ivS8nJk98T9Q"
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

  # 리스너: INTERNAL(클러스터 안) · CONTROLLER · EXTERNAL(로컬 개발)
  KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
  KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-0.kafka-headless.cartmate.svc.cluster.local:9092,EXTERNAL://localhost:30094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

  # 저장 위치
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"

  # 단일 브로커: 복제 관련 값은 모두 1
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"

  # 토픽 기본값. 자동 생성되는 토픽도 이 값을 쓴다
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # 보존 정책: 72시간 또는 파티션당 1GB
  KAFKA_LOG_RETENTION_HOURS: "72"
  KAFKA_LOG_RETENTION_BYTES: "1073741824"
  KAFKA_LOG_SEGMENT_BYTES: "268435456"

  # 리소스 절약
  KAFKA_NUM_NETWORK_THREADS: "1"
  KAFKA_NUM_IO_THREADS: "2"
  KAFKA_BACKGROUND_THREADS: "2"
  KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"

  # JVM
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError"
---
# 브로커 Pod 이름(kafka-0.kafka-headless)을 주소로 쓰기 위한 headless Service
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
# 앱이 처음 접속하는 주소
apiVersion: v1
kind: Service
metadata:
  name: cartmate-kafka-bootstrap
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
---
# 로컬 개발용 외부 접속 (모든 노드의 30094)
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30094
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Service 링크 환경변수(KAFKA_PORT 등)를 이미지가 설정으로 읽어서 기동이 깨지므로 끈다
      enableServiceLinks: false
      nodeSelector:
        cartmate/node: agent
      securityContext:
        fsGroup: 1000   # 이미지 실행 사용자(appuser)가 데이터 디렉터리에 쓸 수 있게 한다
      containers:
        - name: kafka
          image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
          ports:
            - name: internal
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: external
              containerPort: 9094
          envFrom:
            - configMapRef:
                name: kafka-config
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ ReadWriteOnce ]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
