# Elasticsearch 1대. 기존 서버(개발용 infra 네임스페이스) 설정을 따른다
#   한국어 분석기(analysis-nori)를 initContainer가 설치한다. 플러그인 폴더는 emptyDir라 Pod가 새로 뜰 때마다 다시 설치한다
#   비밀번호 인증만 켜고 TLS는 끈다. elastic 계정 비밀번호는 Secret es-secret의 elastic-password
#   접속 주소(클러스터 안): http://elasticsearch:9200 (지금 앱 코드는 쓰지 않는다. 쓰는 서비스가 생기면 그 서비스 매니페스트에 주소를 넣는다)
#   노드: server
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        cartmate/node: server
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: install-nori
          image: elasticsearch:9.5.5@sha256:b7b0f24e9b5e90656ffe69804b3a48907499ab2b9cd67f02b7af3aff1b026a89
          command: ["sh", "-c", "bin/elasticsearch-plugin install --batch analysis-nori"]
          env:
            - name: CLI_JAVA_OPTS
              value: "-Xmx128m"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: plugins
              mountPath: /usr/share/elasticsearch/plugins
      containers:
        - name: elasticsearch
          image: elasticsearch:9.5.5@sha256:b7b0f24e9b5e90656ffe69804b3a48907499ab2b9cd67f02b7af3aff1b026a89
          ports:
            - name: http
              containerPort: 9200
              hostPort: 9200   # 로컬 개발에서 노드 포트로 직접 붙을 때 쓴다. 방화벽으로 접근을 제한한다
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.name
              value: cartmate-es
            # 비밀번호 인증은 켜고, HTTP · 노드 간 TLS는 끈다
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-secret
                  key: elastic-password
            - name: xpack.ml.enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms448m -Xmx448m"
          # CPU 보장량은 실제 사용량에 맞춰 낮춘다(부하 테스트 최대 185m, 2026-11-19). 남은 몫은 Traefik(traefik-config.yaml)에 준다.
          # CPU가 꽉 차서 검색이 느려지면 product가 2초 뒤 MySQL 검색으로 대신한다
          resources:
            requests:
              memory: 1Gi
              cpu: 150m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: plugins
              mountPath: /usr/share/elasticsearch/plugins
          # 인증이 켜져 있어서 비밀번호를 넣어 상태를 확인한다
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -sf -u elastic:$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?local=true'"]
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -u elastic:$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?local=true'"]
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ ReadWriteOnce ]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
