apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  labels:
    app: member-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 서버 메모리가 빠듯해서 새 Pod를 먼저 띄우지 않는다(maxSurge 0). 기존 Pod를 내리고 새 Pod를 띄운다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service   # Loki service 라벨. -service로 끝나야 로그를 수집한다
    spec:
      # 종료 순서: preStop 5초(Service 대상에서 빠질 시간) → 처리 중인 요청 마무리(Spring Boot graceful shutdown 기본, 최대 30초). 합 35초 < 45초
      terminationGracePeriodSeconds: 45
      # 같은 네임스페이스 Service마다 쿠버네티스가 <이름>_PORT=tcp://IP:포트 같은 환경변수를 자동으로 넣는다(서비스 링크)
      # 앱 설정의 MEMBER_SERVICE_PORT · REDIS_CACHE_PORT 등과 이름이 겹쳐 server.port 변환이 실패하므로 끈다
      enableServiceLinks: false
      # 띄울 노드(cartmate/node 라벨). server = k3s server 노드(member · order · payment · etc), agent = k3s agent 노드(트래픽이 가장 많은 상품 서버를 떼어 둔다)
      nodeSelector:
        cartmate/node: server
      # Docker Hub에서 이미지를 받을 로그인 정보. 서버에서 한 번 만든다(Secret 이름 dockerhub-pull)
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: member-service
          image: cartmate-member-service   # 실제 이미지 이름 · 태그는 CD가 kustomize로 바꾼다
          ports:
            - name: http
              containerPort: 8981
          envFrom:
            - configMapRef:
                name: cartmate-app-config
            - secretRef:
                name: cartmate-app-secret
            - secretRef:
                name: member-service-secret
          env:
            # 메일 발송을 끈다: 운영 설정(application-prod.yaml)은 cartmate.mail.enabled=true지만 아직 메일(SMTP) 계정이 없다
            # 끄면 인증번호 · 보안 알림을 메일 대신 로그로 남긴다(LogVerificationMailSender). 로그를 볼 수 있는 사람은 인증번호를 볼 수 있다
            # 메일 계정을 받으면 이 env를 지우고 member-service-secret에 MAIL_HOST · MAIL_PORT · MAIL_USERNAME · MAIL_PASSWORD · MAIL_SMTP_AUTH · MAIL_STARTTLS를 넣는다
            - name: CARTMATE_MAIL_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
          # 기동이 끝날 때까지(최대 5초 × 36 = 3분) liveness · readiness 검사를 하지 않는다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  labels:
    app: member-service
spec:
  selector:
    app: member-service
  ports:
    - name: http
      port: 8981
      targetPort: http
